<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración | Parroquia</title>
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        load_config_file: false,
        publish_mode: "editorial_workflow",
        backend: {
          name: "git-gateway",
          branch: "main",
        },
        media_folder: "public/uploads",
        public_folder: "/uploads",
        locale: "es",
        collections: [
          {
            name: "anuncios",
            label: "Anuncios",
            folder: "src/content/anuncios",
            create: true,
            slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
            fields: [
              { label: "Título", name: "title", widget: "string" },
              { label: "Resumen corto", name: "summary", widget: "text" },
              { label: "Contenido", name: "body", widget: "markdown" },
            ],
          },
          {
            name: "paginas",
            label: "Páginas fijas",
            files: [
              {
                file: "src/content/paginas/horarios.md",
                label: "Horarios de misa",
                name: "horarios",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  { label: "Contenido", name: "body", widget: "markdown" },
                ],
              },
              {
                file: "src/content/paginas/historia.md",
                label: "Historia y Patrimonio",
                name: "historia",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  { label: "Contenido", name: "body", widget: "markdown" },
                ],
              },
              {
                file: "src/content/paginas/catequesis.md",
                label: "Catequesis",
                name: "catequesis",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  { label: "Contenido", name: "body", widget: "markdown" },
                ],
              },
              {
                file: "src/content/paginas/pastoral-salud.md",
                label: "Pastoral de la Salud",
                name: "pastoral-salud",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  { label: "Contenido", name: "body", widget: "markdown" },
                ],
              },
              {
                file: "src/content/paginas/hermandad-dolores.md",
                label: "Hermandad de los Dolores",
                name: "hermandad-dolores",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  { label: "Contenido", name: "body", widget: "markdown" },
                ],
              },
              {
                file: "src/content/paginas/hermandad-salud.md",
                label: "Hermandad de la Salud",
                name: "hermandad-salud",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  { label: "Contenido", name: "body", widget: "markdown" },
                ],
              },
              {
                file: "src/content/paginas/hermandad-resucitado.md",
                label: "Hermandad del Resucitado",
                name: "hermandad-resucitado",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  { label: "Contenido", name: "body", widget: "markdown" },
                ],
              },
              {
                file: "src/content/paginas/calendario.md",
                label: "Calendario Litúrgico",
                name: "calendario",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  {
                    label: "Eventos del mes",
                    name: "eventos",
                    widget: "list",
                    fields: [
                      { label: "Día del mes", name: "dia", widget: "number", value_type: "int", min: 1, max: 31 },
                      { label: "Descripción", name: "texto", widget: "string" },
                      {
                        label: "Tipo",
                        name: "tipo",
                        widget: "select",
                        options: [
                          { label: "Misa especial", value: "misa" },
                          { label: "Sacramento", value: "sacramento" },
                          { label: "Pastoral", value: "pastoral" },
                          { label: "Formación", value: "formacion" },
                          { label: "Evento especial", value: "especial" },
                          { label: "Festividad", value: "festivo" },
                        ],
                      },
                    ],
                  },
                  { label: "Próximos eventos (texto)", name: "body", widget: "markdown" },
                ],
              },
              {
                file: "src/content/paginas/contacto.md",
                label: "Contacto",
                name: "contacto",
                fields: [
                  { label: "Título", name: "title", widget: "string" },
                  { label: "Dirección", name: "direccion", widget: "string" },
                  { label: "Teléfono", name: "telefono", widget: "string" },
                  { label: "Email", name: "email", widget: "string" },
                  { label: "Mapa de Google (código embed)", name: "mapa", widget: "text" },
                ],
              },
            ],
          },
        ],
      },
    });
  </script>
</body>
</html>
